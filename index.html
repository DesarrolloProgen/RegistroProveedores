<!DOCTYPE html>
<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta charset="UTF-8" />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
      integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk"
      crossorigin="anonymous"
    />
    <!-- Select2 (desplegables con buscador) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css"
    />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>Registro Proveedores</title>
  </head>
  <body style="overflow-x: hidden">
    <!-- Aviso si no se pudo cargar el formulario (GET /formulario) -->
    <div id="errorCatalogo" class="alert alert-danger" style="display: none">
      <span id="errorCatalogoTexto"></span>
      <button type="button" class="btn btn-sm btn-outline-danger ml-2" onclick="cargarCatalogo()">
        Reintentar
      </button>
    </div>

    <!-- Pantalla de confirmación (tras POST /:numero/enviar) -->
    <div id="confirmacion" style="display: none">
      <fieldset class="border p-2">
        <legend class="w-auto" style="margin-left: 50px; font-size: large">
          Solicitud recibida
        </legend>
        <p class="numero-registro" id="numeroRegistro"></p>
        <p>Tu solicitud está en revisión; te escribiremos al correo de contacto.</p>
        <button type="button" class="btn btn-success" onclick="location.reload()">
          Hacer otro registro
        </button>
      </fieldset>
    </div>

    <form id="formulario" onsubmit="return false;" novalidate>
      <!-- Trampa para bots: una persona nunca la ve ni la llena -->
      <div class="trampa" aria-hidden="true">
        <label for="sitioWeb">Sitio web</label>
        <input id="sitioWeb" name="sitioWeb" type="text" tabindex="-1" autocomplete="off" />
      </div>

      <!--Leyenda y cuadro datos Proveedor-->

      <fieldset class="border p-2">
        <legend class="w-auto" style="margin-left: 50px; font-size: large">
          Datos Proveedor
        </legend>

        <!--Fila Tipo Registro -->
        <div class="row g-3 align-items-center">
          <label for="t_registro" class="col-sm-2 col-form-label offset-md-1"
            >Tipo de registro</label
          >
          <div class="col-sm-4">
            <select
              id="t_registro"
              name="t_registro"
              class="form-control"
              onchange="actualizarCondicionPago()"
            >
              <option value="" disabled selected>Selecciona una opción</option>
            </select>
          </div>
        </div>

        <!--Fila Tipo Empresa -->
        <div class="row g-3 align-items-center">
          <label for="t_empresa" class="col-sm-2 col-form-label offset-md-1"
            >Tipo de Empresa</label
          >
          <div class="col-sm-4">
            <select
              id="t_empresa"
              name="t_empresa"
              class="form-control"
              onchange="tipopersonaOnchange(this)"
            >
              <option value="" disabled selected>Selecciona una opción</option>
            </select>
          </div>
        </div>

        <!--Fila País -->
        <div class="row g-3 align-items-center">
          <label for="pais" class="col-sm-2 col-form-label offset-md-1"
            >País</label
          >
          <div class="col-sm-4">
            <select id="pais" name="pais" class="form-control">
              <option value="" disabled selected>Selecciona un país</option>
            </select>
          </div>
        </div>

        <!--Fila Ciudad (solo visible cuando el país es Colombia) -->
        <div id="filaCiudadColombia" class="row g-3 align-items-center" style="display: none">
          <label for="ciudad" class="col-sm-2 col-form-label offset-md-1"
            >Ciudad</label
          >
          <div class="col-sm-4">
            <select id="ciudad" name="ciudad" class="form-control">
              <option value="" disabled selected>Selecciona una ciudad</option>
            </select>
          </div>
        </div>

        <!-- Fila para tipo y numero de identificacion-->
        <div id="datos" style="display: none">
          <div class="row g-3 align-items-center">
            <!--Tipo de indentificación-->
            <label
              for="t_identificacion"
              class="col-sm-2 col-form-label offset-md-1"
              >Tipo de identificación</label
            >
            <div class="col-sm-2">
              <select
                id="t_identificacion"
                name="t_identificacion"
                class="form-control"
                onchange="tipoindentificacionOnchange(this)"
              >
                <option value="" disabled selected>Seleccionar</option>
              </select>
            </div>
            <!--Cedula-->
            <div id="cedula" class="form-row col-md-6" style="display: none">
              <label for="cc" class="col-sm-1 col-form-label offset-md-1"
                >Cédula:</label
              >
              <input
                id="cc"
                name="cc"
                class="form-control col-sm-6 offset-sm-1"
                type="text"
                placeholder="Ingrese su número de Cedula"
                requerid
              />
            </div>

            <!-- NIT -->
            <div id="nit" class="form-row col-md-6" style="display: none">
              <label for="numeroNIT" class="col-sm-1 col-form-label offset-md-1"
                >NIT:</label
              >
              <input
                id="numeroNIT"
                name="numeroNIT"
                class="form-control col-sm-4"
                type="text"
                placeholder="Ingrese su NIT"
                requerid
              />
              <label for="codigoNIT" class="col-form-label">DV</label>
              <input
                id="codigoNIT"
                name="codigoNIT"
                class="form-control col-sm-1"
                type="text"
                placeholder="Ingrese su digito de verificación"
                requerid
              />
            </div>
          </div>

          <!-- Fila Nombre -->

          <div class="row g-3 align-items-center">
            <label
              for="nombreUsuario"
              class="col-sm-2 col-form-label offset-md-1"
              style="margin-right: 12px"
              >Razón Social o Nombre de Proveedor:</label
            >
            <input
              id="nombreUsuario"
              name="nombreUsuario"
              class="form-control col-sm-4"
              type="text"
              placeholder="Ingrese su nombre proveedor"
              requerid
            />
          </div>
        </div>
      </fieldset>

      <!-- Seccion Tipo proveedor-->

      <fieldset id="contacto" class="border p-2" style="display: none">
        <legend class="w-auto" style="margin-left: 50px; font-size: large">
          Datos de Contacto
        </legend>

        <div id="contacto_nivel_1_2" style="display: none">
          <!-- Nombre de Contacto-->

          <div class="row g-3 align-items-center">
            <label
              for="nombreContacto1"
              class="col-sm-2 col-form-label offset-md-1"
              style="margin-right: 12px"
              >Nombre de Contacto:</label
            >
            <input
              id="nombreContacto1"
              name="nombreContacto1"
              class="form-control col-sm-4"
              type="text"
              placeholder="Ingrese un nombre de contacto"
              requerid
            />
          </div>

          <!-- telefono de Contacto-->

          <div class="row g-3 align-items-center">
            <label
              for="telefonoContacto1"
              class="col-sm-2 col-form-label offset-md-1"
              style="margin-right: 12px"
              >Telefono:</label
            >
            <input
              id="telefonoContacto1"
              name="telefonoContacto1"
              class="form-control col-sm-4"
              type="text"
              placeholder="Ingrese un telefono de contacto"
              requerid
            />
          </div>

          <!-- Email de Contacto-->

          <div class="row g-3 align-items-center">
            <label
              for="correoContacto1"
              class="col-sm-2 col-form-label offset-md-1"
              style="margin-right: 12px"
              >Email:</label
            >
            <input
              id="correoContacto1"
              name="correoContacto1"
              class="form-control col-sm-4 email-input"
              type="email"
              placeholder="Ingrese un correo de contacto"
              requerid
            />
          </div>
          <!-- Condición de Pago (nacional, solo en Inscripción) -->
          <div id="filaCondicionPagoNacional" class="row g-3 align-items-center" style="display: none">
            <label
              for="condicionPagoNacional"
              class="col-sm-2 col-form-label offset-md-1"
              >Condición de Pago:</label
            >
            <div class="col-sm-4">
              <select
                id="condicionPagoNacional"
                name="condicionPagoNacional"
                class="form-control"
              >
                <option value="" disabled selected>Selecciona una opción</option>
              </select>
            </div>
          </div>
        </div>

        <div id="exterior" style="display: none">
          <!-- Razón Social o Nombre del Proveedor del Exterior -->
          <div class="row g-3 align-items-center">
            <label
              for="nombreProveedorExterior"
              class="col-sm-2 col-form-label offset-md-1"
              style="margin-right: 12px"
              >Razón Social o Nombre de Proveedor:</label
            >
            <input
              id="nombreProveedorExterior"
              name="nombreProveedorExterior"
              class="form-control col-sm-4"
              type="text"
              placeholder="Ingrese nombre o razón social"
              requerid
            />
          </div>

          <!-- Ciudad (texto libre; el país se toma de la sección Datos Proveedor) -->
          <div class="row g-3 align-items-center">
            <label
              for="ciudadExterior"
              class="col-sm-2 col-form-label offset-md-1"
              style="margin-right: 12px"
              >Ciudad:</label
            >
            <input
              id="ciudadExterior"
              name="ciudadExterior"
              class="form-control col-sm-4"
              type="text"
              placeholder="Ingrese su ciudad"
              requerid
            />
          </div>

          <!-- Dirección -->
          <div class="row g-3 align-items-center">
            <label
              for="direccion"
              class="col-sm-2 col-form-label offset-md-1"
              style="margin-right: 12px"
              >Dirección:</label
            >
            <input
              id="direccion"
              name="direccion"
              class="form-control col-sm-4"
              type="text"
              placeholder="Ingrese su dirección completa"
              requerid
            />
          </div>

          <!-- Nombre de Contacto-->

          <div class="row g-3 align-items-center">
            <label
              for="nombreContacto"
              class="col-sm-2 col-form-label offset-md-1"
              style="margin-right: 12px"
              >Nombre de Contacto:</label
            >
            <input
              id="nombreContacto"
              name="nombreContacto"
              class="form-control col-sm-4"
              type="text"
              placeholder="Ingrese un nombre de contacto"
              requerid
            />
          </div>

          <!-- telefono de Contacto-->

          <div class="row g-3 align-items-center">
            <label
              for="telefonoContacto"
              class="col-sm-2 col-form-label offset-md-1"
              style="margin-right: 12px"
              >Telefono:</label
            >
            <input
              id="telefonoContacto"
              name="telefonoContacto"
              class="form-control col-sm-4"
              type="text"
              placeholder="Ingrese un telefono de contacto"
              requerid
            />
          </div>

          <!-- Email de Contacto-->

          <div class="row g-3 align-items-center">
            <label
              for="correoContacto"
              class="col-sm-2 col-form-label offset-md-1"
              style="margin-right: 12px"
              >Email:</label
            >
            <input
              id="correoContacto"
              name="correoContacto"
              class="form-control col-sm-4 email-input"
              type="email"
              placeholder="Ingrese un correo de contacto"
              requerid
            />
          </div>

          <!-- Cargo -->
          <div class="row g-3 align-items-center">
            <label
              for="cargo"
              class="col-sm-2 col-form-label offset-md-1"
              style="margin-right: 12px"
              >Cargo:</label
            >
            <input
              id="cargo"
              name="cargo"
              class="form-control col-sm-4"
              type="text"
              placeholder="Ingrese su cargo"
              requerid
            />
          </div>

          <!-- Moneda -->

          <div class="row g-3 align-items-center">
            <label for="moneda" class="col-sm-2 col-form-label offset-md-1"
              >Moneda:</label
            >
            <div class="col-sm-4">
              <select id="moneda" name="moneda" class="form-control">
                <option value="" disabled selected>Selecciona una opción</option>
              </select>
            </div>
          </div>

          <!-- Condición de Pago (exterior, solo en Inscripción) -->

          <div id="filaCondicionPago" class="row g-3 align-items-center" style="display: none">
            <label
              for="condicionPago"
              class="col-sm-2 col-form-label offset-md-1"
              >Condición de Pago:</label
            >
            <div class="col-sm-4">
              <select
                id="condicionPago"
                name="condicionPago"
                class="form-control"
              >
                <option value="" disabled selected>Selecciona una opción</option>
              </select>
            </div>
          </div>

          <!-- Fila Tipo de actividad economica -->
          <div class="row g-3 align-items-center">
            <label
              for="tipoactividad"
              class="col-sm-2 col-form-label offset-md-1"
              >Tipo de Actividad Económica:</label
            >
            <div class="col-sm-4">
              <select
                id="tipoactividad"
                name="tipoactividad"
                class="form-control"
              >
                <option value="" disabled selected>Selecciona una opción</option>
              </select>
            </div>
          </div>
        </div>
      </fieldset>
      <!--Seccion Cargue de Documentos-->

      <fieldset id="archivos" class="border p-2" style="display: none">
        <legend class="w-auto" style="margin-left: 50px; font-size: large">
          Cargue de Archivos
        </legend>

        <div
          id="Persona_Natural"
          class="container"
          style="display: none"
        >
          <!--Subir formato de registro debidamente firmado-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="FormularioNatural"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Formulario de registro de Proveedores debidamente
                  firmado</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>

          <!--Subir archivo de cedula de Ciudadania-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="copiacedula"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Copia de la Cédula de Ciudadanía</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>

          <!--Subir RUT-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="copiaRut"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Copia de RUT actualizado en sus responsabilidades tributarias
                  impreso durante el último año.</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>

          <!-- subirCertificación Bancaria no mayor a 90 días.-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="certBancariaNatural"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Certificación Bancaria no mayor a 90 días.</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>

          <!-- Copia de certificaciones que posea BASC, ISO, etc.-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="certificaciones"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Copia de certificaciones que posea BASC, ISO, etc.</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>

          <!-- Acuerdo de seguridad -->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="acuerdoSeguridadNatural"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Acuerdo de seguridad</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>
        </div>

        <div
          id="Persona_Juridica"
          class="container"
          style="display: none"
        >
          <!--Subir formato de registro debidamente firmado-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="Formulariojuridico"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Formulario de registro de Proveedores debidamente
                  firmado</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>

          <!--Subir archivo de Certificado Existencia y Representación Legal no mayor a 30 días.-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="certificadoExistencia"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Certificado Existencia y Representación Legal no mayor a 30
                  días.</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>

          <!--Subir cédula del Representante legal.-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="representanteLegal"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Copia de cédula del Representante legal.</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>

          <!-- subir Copia de RUT no mayor a 30 días.-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="RUT"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Copia de RUT actualizado en sus responsabilidades tributarias
                  impreso durante el último año.</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>

          <!-- subir Copia de RUT no mayor a 30 días.-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="certBancariaJuridica"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Certificación Bancaria no mayor a 90 días.</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>

          <!-- Copia de certificaciones que posea BASC, ISO, etc.-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="certBASC"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Copia de certificaciones que posea BASC, ISO, etc.</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>

          <!-- Acuerdo de seguridad -->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="acuerdoSeguridadJuridica"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Acuerdo de seguridad</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>
        </div>

        <div
          id="Taller_Servicio"
          class="container"
          style="display: none"
        >
          <!--Acuerdo de trabajo-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="acuerdoTrabajo"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Acuerdo de servicio</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>

          <!--Cédula o RUT-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="cedulaRutTaller"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Cédula o RUT</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>

          <!--Certificación Bancaria-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="certBancariaTaller"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Certificación Bancaria no mayor a 90 días.</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>

          <!--Acuerdo de seguridad-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="acuerdoSeguridadTaller"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Acuerdo de seguridad</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>
        </div>
      </fieldset>

      <fieldset id="archivosExterior" class="border p-2" style="display: none">
        <legend class="w-auto" style="margin-left: 50px; font-size: large">
          Cargue de Archivos
        </legend>

        <div class="container">
          <!--Subir formato de registro debidamente firmado-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="RegistroFiscal"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Registro Fiscal</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>

          <!--Subir archivo de Certificado Existencia y Representación Legal no mayor a 30 días.-->
          <div class="row g-3">
            <div class="col-md-8">
              <div class="custom-file">
                <input
                  type="file"
                  name="certificadoBancarioExterior"
                  class="custom-file-input"
                  id="customFile"
                />
                <label class="custom-file-label" for="customFile"
                  >Certificado Bancaria</label
                >
              </div>
            </div>
            <div class="col-md-4 estado-archivo"></div>
          </div>
        </div>
      </fieldset>

      <fieldset class="border p-2">
        <legend class="w-auto" style="margin-left: 50px; font-size: large">
          Contacto Progen
        </legend>
        <div id="filaNombreContactoProgen" class="row g-3 align-items-center">
          <label
            for="nombreContactoProgen"
            class="col-sm-2 col-form-label offset-md-1"
            style="margin-right: 12px"
            >Nombre Contacto:</label
          >
          <select
            id="nombreContactoProgen"
            name="nombreContactoProgen"
            class="form-control col-sm-4"
            requerid
          >
            <option value="" disabled selected>Selecciona un nombre</option>
          </select>
        </div>

        <!-- Los talleres no eligen contacto: PROGEN les asigna el de talleres -->
        <div id="filaContactoTaller" class="row g-3 align-items-center" style="display: none">
          <div class="col-md-8 offset-md-1 col-form-label">
            Tu contacto en PROGEN será el responsable de talleres aliados.
          </div>
        </div>

        <!-- Autorización de tratamiento de datos (texto de GET /formulario) -->
        <div class="row g-3 align-items-center">
          <div class="col-md-10 offset-md-1">
            <div class="form-check">
              <input id="aceptaTratamientoDatos" type="checkbox" class="form-check-input" />
              <label id="textoAutorizacion" for="aceptaTratamientoDatos" class="form-check-label"></label>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-8 offset-md-1">
            <input
              style="margin-top: 3px; font-size: smaller"
              id="boton"
              type="button"
              class="btn btn-lg btn-success"
              value="Enviar Registro"
              onclick="submitForm()"
              disabled
            />
          </div>
        </div>
      </fieldset>

      <!--Modal para notificaciones-->

      <div
        class="modal fade"
        id="exampleModal"
        tabindex="-1"
        role="dialog"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header" id="headermensaje">
              <h5 class="modal-title" id="titulomensaje">Realizado</h5>
              <button
                type="button"
                class="close"
                data-dismiss="modal"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div id="mensaje" class="modal-body"></div>
            <div class="modal-footer">
              <button
                id="botonRecargar"
                type="button"
                class="btn btn-outline-primary"
                onclick="location.reload()"
                style="display: none"
              >
                Recargar
              </button>
              <button
                type="button"
                class="btn btn-success"
                data-dismiss="modal"
              >
                OK
              </button>
            </div>
          </div>
        </div>
      </div>
    </form>

    <!-- Aviso flotante para seguir bajando (el formulario se muestra en un iframe) -->
    <button
      id="indicadorScroll"
      type="button"
      onclick="bajarUnPoco()"
      title="Hay más contenido abajo"
    >
      <span>Sigue bajando</span><span class="flecha">&#9660;</span>
    </button>

    <script
      src="https://code.jquery.com/jquery-3.5.1.min.js"
      integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
      integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI"
      crossorigin="anonymous"
    ></script>
    <!-- Select2 (desplegables con buscador) -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/datos.js"></script>
    <script src="./js/formato.js"></script>
    <script src="./js/onchange.js"></script>
    <script src="./js/archivos.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/validaciones.js"></script>
    <script src="./js/init.js"></script>
  </body>
</html>
